<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#17181D" />
    <!-- Icons ship inside the bundle (relative paths; no manifest or share image: the portal is the page). -->
    <link rel="icon" href="./public/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./public/brand/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./public/brand/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="./public/brand/apple-touch-icon.png" sizes="180x180" />
    <title>%GAME_TITLE%</title>
    <meta name="author" content="%STUDIO_NAME%" />
    <!-- CrazyGames SDK v3. If it cannot load (offline, another portal), the game runs without it. -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <style>
      html,body{margin:0;height:100%;background:#0a0d18}
      /* Before the script runs: the same screen the game's loader shows, at 0 % (nothing but the page has loaded). */
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:hidden;color:#ffd23f;font:400 44px Bungee,system-ui,sans-serif}
      #boot:before{content:'';position:absolute;left:-50%;right:-50%;bottom:-30%;height:90%;background-image:linear-gradient(rgba(62,197,255,.35) 2px,transparent 2px),linear-gradient(90deg,rgba(62,197,255,.35) 2px,transparent 2px);background-size:80px 120px;transform:perspective(420px) rotateX(62deg);transform-origin:50% 0;-webkit-mask-image:linear-gradient(to top,#000 30%,transparent 95%);mask-image:linear-gradient(to top,#000 30%,transparent 95%);animation:g 1.1s linear infinite}
      #boot b{position:relative;display:block;width:min(22rem,80vw);height:8px;border-radius:8px;background:rgba(230,235,245,.1)}
      #boot small{position:relative;font:600 13px system-ui,sans-serif;color:rgba(230,235,245,.85)}
      @keyframes g{to{background-position:0 120px}}
      @media (prefers-reduced-motion:reduce){#boot:before{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" role="progressbar" aria-label="Loading" aria-valuenow="0"><span style="position:relative">Parking Lot</span><b></b><small>Loading the page</small></div></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
